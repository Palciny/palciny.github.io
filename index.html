<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Denník N Audio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #12192f;
      --panel-2: #18233f;
      --text: #edf2ff;
      --muted: #b3bfdc;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #7aa2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg), #101936);
      color: var(--text);
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 2.8rem); }
    p { margin: 0 0 28px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    a.card {
      display: block;
      padding: 24px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      transition: border-color .15s, background .15s, transform .15s;
    }
    a.card:hover, a.card:focus-visible {
      border-color: var(--accent);
      background: var(--panel-2);
      transform: translateY(-2px);
      outline: none;
    }
    .flag {
      display: inline-block;
      margin-bottom: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--accent);
    }
    .name { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; }
    .desc { color: var(--muted); font-size: .95rem; }
    .arrow { margin-top: 16px; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Denník N Audio</h1>
    <p>MP3 prehrávače článkov · Audio přehrávače článků</p>
    <div class="grid">
      <a class="card" href="/dennikn-sk-mp3-player/">
        <span class="flag">SK</span>
        <div class="name">Denník N</div>
        <div class="desc">Slovenské vydanie, aktualizované denne.</div>
        <div class="arrow">Otvoriť prehrávač →</div>
      </a>
      <a class="card" href="/denikn-cz-mp3-player/">
        <span class="flag">CZ</span>
        <div class="name">Deník N</div>
        <div class="desc">České vydání, aktualizované denně.</div>
        <div class="arrow">Otevřít přehrávač →</div>
      </a>
    </div>
  </main>
</body>
</html>
